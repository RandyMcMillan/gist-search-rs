<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gist-search — search every gist of a GitHub user</title>
  <style>
    /* GitHub Primer-derived design tokens */
    :root, [data-theme="light"] {
      --bg: #ffffff;
      --bg-subtle: #f6f8fa;
      --fg: #1f2328;
      --fg-muted: #59636e;
      --border: #d1d9e0;
      --accent: #0969da;
      --accent-hover: #0860ca;
      --btn-bg: #1f883d;
      --btn-hover: #1a7f37;
      --btn-text: #ffffff;
      --input-bg: #ffffff;
      --hit-hover: #f6f8fa;
      --meta: #9a6700;
      --danger: #d1242f;
      --shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-subtle: #161b22;
      --fg: #e6edf3;
      --fg-muted: #9198a1;
      --border: #30363d;
      --accent: #4493f8;
      --accent-hover: #58a6ff;
      --btn-bg: #238636;
      --btn-hover: #2ea043;
      --btn-text: #ffffff;
      --input-bg: #0d1117;
      --hit-hover: #161b22;
      --meta: #d29922;
      --danger: #f85149;
      --shadow: 0 0 transparent;
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg: #0d1117;
        --bg-subtle: #161b22;
        --fg: #e6edf3;
        --fg-muted: #9198a1;
        --border: #30363d;
        --accent: #4493f8;
        --accent-hover: #58a6ff;
        --btn-bg: #238636;
        --btn-hover: #2ea043;
        --btn-text: #ffffff;
        --input-bg: #0d1117;
        --hit-hover: #161b22;
        --meta: #d29922;
        --danger: #f85149;
        --shadow: 0 0 transparent;
      }
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] { color-scheme: dark; }
    }

    body {
      margin: 0; padding: 2rem 1rem 4rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.5;
      background: var(--bg); color: var(--fg);
    }
    .container { max-width: 980px; margin-inline: auto; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    h1 a { color: var(--fg); text-decoration: none; }
    h1 a:hover { color: var(--accent); }
    .sub { color: var(--fg-muted); margin: 0 0 1rem; }

    /* theme switch — GitHub segmented control */
    .segmented {
      display: inline-flex; padding: 3px;
      background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 6px;
    }
    .segmented button {
      border: none; background: transparent; color: var(--fg-muted);
      padding: 3px 10px; border-radius: 6px; cursor: pointer;
      font: inherit; font-size: 12px;
    }
    .segmented button[aria-pressed="true"] {
      background: var(--bg); color: var(--fg);
      box-shadow: var(--shadow), 0 1px 1px rgba(31, 35, 40, 0.15);
      border: 1px solid var(--border);
      margin: -1px;
    }

    fieldset {
      border: 1px solid var(--border); border-radius: 6px;
      padding: .75rem 1rem; margin: 0 0 1rem;
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    }
    legend { padding: 0 .5rem; color: var(--fg-muted); font-size: 12px; }

    input[type=text], input[type=password] {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--fg); padding: 5px 12px; font: inherit;
    }
    input[type=text]:focus, input[type=password]:focus {
      outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
    }

    button.primary {
      background: var(--btn-bg); border: 1px solid rgba(31, 35, 40, 0.15);
      border-radius: 6px; color: var(--btn-text);
      padding: 5px 16px; font: inherit; font-weight: 500; cursor: pointer;
    }
    button.primary:hover:not(:disabled) { background: var(--btn-hover); }
    button.primary:disabled { opacity: .5; cursor: default; }

    label.check { display: inline-flex; gap: .35rem; align-items: center; white-space: nowrap; color: var(--fg-muted); }

    #status { color: var(--fg-muted); margin: .5rem 0; white-space: pre-wrap; }
    .error { color: var(--danger); }

    /* results — modeled on GitHub code-search result rows */
    #results .count { color: var(--fg-muted); margin: .5rem 0; }
    #results .hit {
      border: 1px solid var(--border); border-radius: 6px;
      padding: .75rem 1rem; margin-bottom: .75rem;
    }
    #results .hit:hover { background: var(--hit-hover); }
    #results .hit a.title { color: var(--accent); font-weight: 600; word-break: break-all; }
    #results .hit a.title:hover { text-decoration: underline; }
    #results .desc { color: var(--fg-muted); margin: .25rem 0; }
    #results .match {
      margin: 0; white-space: pre-wrap; word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }
    #results .lineno { color: var(--fg-muted); }
    #results .meta { color: var(--meta); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="https://github.com/RandyMcMillan/gist-search-rs">gist-search</a></h1>
      <div class="segmented" role="group" aria-label="Theme">
        <button id="theme-system" aria-pressed="true">System</button>
        <button id="theme-light" aria-pressed="false">Light</button>
        <button id="theme-dark" aria-pressed="false">Dark</button>
      </div>
    </header>

    <p class="sub">
      Search every gist created by a GitHub user (default:
      <a href="https://gist.github.com/rust-play" style="color:var(--accent)">rust-play</a>).
      Metadata search runs in Rust-compiled WASM; content search runs in your browser.
      Use GitHub-style qualifiers: <code>user:</code>, <code>language:</code>
      — e.g. <code>user:rust-play language:rust fn main</code>.
    </p>

    <fieldset>
      <legend>index</legend>
      <input type="text" id="user" value="rust-play" placeholder="github user" />
      <input type="password" id="token" placeholder="token (optional, raises rate limit)" size="34" />
      <button id="sync" class="primary">Sync</button>
      <span id="indexinfo" class="sub"></span>
    </fieldset>

    <fieldset>
      <legend>search</legend>
      <input type="text" id="pattern" placeholder='user:rust-play language:rust "fn main"' style="flex:1;min-width:18rem" />
      <label class="check"><input type="checkbox" id="ignorecase" /> -i</label>
      <label class="check"><input type="checkbox" id="content" /> --content</label>
      <button id="search" class="primary" disabled>Search</button>
    </fieldset>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

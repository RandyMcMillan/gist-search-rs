name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Prebuilt binaries — no long `cargo install` compile on every run.
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      # Version must match the wasm-bindgen entry in Cargo.toml.
      - name: Install wasm-bindgen-cli
        run: cargo binstall -y wasm-bindgen-cli@0.2.130

      - name: Build WASM
        run: cargo build --release --lib --features wasm --target wasm32-unknown-unknown

      - name: Generate JS bindings
        run: wasm-bindgen --target web --out-dir web/pkg --out-name gist_search target/wasm32-unknown-unknown/release/gist_search.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
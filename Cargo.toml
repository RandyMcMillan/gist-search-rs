[package]
name = "gist-search"
version = "0.1.0"
edition = "2021"
description = "Search all gists created by a GitHub user (default: rust-play)"

[[bin]]
name = "gist-search"
path = "src/main.rs"

[lib]
name = "gist_search"
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact pin: the wasm-bindgen CLI in CI and locally must match the library version.
wasm-bindgen = { version = "=0.2.130", optional = true }
